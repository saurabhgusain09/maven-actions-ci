name: maven github actions
on: 
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
jobs:
  tests:
    name: Run test for maven
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          version: '17.0.12'
      - name: running tests
        run: mvn test
  build:
    needs: tests
    name: Building maven
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17.0.12'
      - name: building the jar
        run: mvn clean package
        
      
